workflows:
  ios-workflow:
    name: 말벗 iOS Build
    max_build_duration: 60
    integrations:
      app_store_connect: malbeot_asc
    environment:
      groups:
        - ios_signing
      xcode: latest
      node: 22
      vars:
        XCODE_PROJECT: "malbeot-app/ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.cnsstudiokorea.malbeot"
    scripts:
      - name: Install npm dependencies
        script: |
          cd malbeot-app
          npm install
      - name: Capacitor sync iOS
        script: |
          cd malbeot-app
          npx cap sync ios
      - name: Set up keychain
        script: |
          keychain initialize
      - name: Decode certificate private key
        script: |
          echo "$CERTIFICATE_PRIVATE_KEY_B64" | base64 --decode > /tmp/cert_key.pem
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key "@file:/tmp/cert_key.pem" \
            --create
      - name: Set up signing certificate
        script: |
          keychain add-certificates
      - name: Set up code signing settings
        script: |
          xcode-project use-profiles \
            --project "$XCODE_PROJECT"
      - name: Build ipa
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
      - name: Debug - check actool asset catalog compilation log
        script: |
          echo "=== Searching raw xcodebuild log for asset catalog compilation ==="
          LOG_FILE=
          echo "Log file: $LOG_FILE"
          echo "--- Lines mentioning Assets.xcassets / actool / CompileAssetCatalog ---"
          grep -i -B2 -A15 "CompileAssetCatalog\|actool\|Assets.xcassets" "$LOG_FILE" || echo "NO MATCHES FOUND - actool never ran on Assets.xcassets"
      - name: Debug - inspect built IPA contents
        script: |
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -1)
          echo "IPA path: $IPA_PATH"
          mkdir -p /tmp/ipa_extract
          unzip -o "$IPA_PATH" -d /tmp/ipa_extract > /dev/null
          APP_DIR=$(find /tmp/ipa_extract/Payload -name "*.app" -type d | head -1)
          echo "App bundle: $APP_DIR"
          echo "=== Info.plist icon-related keys ==="
          plutil -p "$APP_DIR/Info.plist" | grep -i -A2 icon
          echo "=== Assets.car exists? ==="
          find "$APP_DIR" -iname "Assets.car" -exec ls -la {} \;
          echo "=== AppIcon entries inside compiled Assets.car ==="
          xcrun --sdk iphoneos assetutil --info "$APP_DIR/Assets.car" 2>&1 | grep -i -B2 -A8 "AppIcon"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

