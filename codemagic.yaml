workflows:
  ios-workflow:
    name: 말벗 iOS Build
    max_build_duration: 60
    integrations:
      app_store_connect: malbeot_asc
    environment:
      groups:
        - ios_signing
      xcode: latest
      vars:
        XCODE_PROJECT: "malbeot-app/ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.cnsstudiokorea.malbeot"
    scripts:
      - name: Set up keychain
        script: |
          keychain initialize
      - name: Decode certificate private key
        script: |
          echo "$CERTIFICATE_PRIVATE_KEY_B64" | base64 --decode > /tmp/cert_key.pem
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key "@file:/tmp/cert_key.pem" \
            --create
      - name: Set up signing certificate
        script: |
          keychain add-certificates
      - name: Set up code signing settings
        script: |
          xcode-project use-profiles \
            --project "$XCODE_PROJECT"
      - name: Build ipa
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true