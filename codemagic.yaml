workflows:
  ios-workflow:
    name: 말벗 iOS Build
    max_build_duration: 60
    integrations:
      app_store_connect: malbeot_asc
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.cnsstudiokorea.malbeot
      xcode: latest
      vars:
        XCODE_PROJECT: "malbeot-app/ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.cnsstudiokorea.malbeot"
    scripts:
      - name: Set up keychain
        script: |
          keychain initialize
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Set up signing certificate
        script: |
          keychain add-certificates
      - name: Set up code signing settings
        script: |
          xcode-project use-profiles
      - name: Build ipa
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true