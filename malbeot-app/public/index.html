<!DOCTYPE html>

<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>말벗 - 실시간으로 마음을 나누는 소통 커뮤니티</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>

:root{

  --font-main:"Pretendard Variable",Pretendard,sans-serif;

  --bg-app:#ffffff; --bg-card:#ffffff; --bg-subtle:#f8f9fa;

  --text-main:#212529; --text-muted:#868e96;

  --primary:#5c7cfa; --primary-hover:#4c6ef5; --primary-light:#edf2ff;

  --pink-avatar:#ff8787; --pink-light:#fff0f6;

  --blue-avatar:#4dabf7; --blue-light:#e7f5ff;

  --warning:#fcc419; --success:#40c057; --danger:#fa5252;

  --border-color:#e9ecef; --shadow-lg:0 12px 40px rgba(0,0,0,.12);

  --radius-sm:8px; --radius-md:16px; --radius-full:9999px;

  --chat-bg:#eaf3fb; --chat-mine:#ffe066;

}

*{box-sizing:border-box;margin:0;padding:0;font-family:var(--font-main);}

body{background:#dee2e6;color:var(--text-main);display:flex;justify-content:center;align-items:center;min-height:100vh;font-size:14px;}

.app-container{width:100%;max-width:480px;height:100vh;max-height:900px;background:#fff;display:flex;flex-direction:column;position:relative;box-shadow:var(--shadow-lg);overflow:hidden;}

@media (min-width:500px){.app-container{border-radius:24px;height:92vh;}}



/* 스플래시 */

#splashScreen{position:fixed;inset:0;background:#fff;z-index:99999;display:flex;align-items:center;justify-content:center;transition:opacity .4s ease;}

#splashScreen.fade-out{opacity:0;pointer-events:none;}

#splashScreen .splash-logo{font-size:34px;font-weight:900;color:var(--primary);letter-spacing:2px;}

#splashScreen .splash-sub{font-size:12px;color:var(--text-muted);margin-top:8px;text-align:center;}



.app-header{height:56px;background:#fff;border-bottom:1px solid var(--border-color);display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:10;flex-shrink:0;}

.header-title{font-size:17px;font-weight:800;color:var(--text-main);}

.header-right{display:flex;align-items:center;gap:10px;}

.user-points-badge{background:var(--primary-light);color:var(--primary);padding:5px 12px;border-radius:var(--radius-full);font-weight:700;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:5px;}

.icon-round-btn{width:34px;height:34px;border-radius:50%;background:var(--bg-subtle);display:flex;align-items:center;justify-content:center;color:var(--primary);font-size:15px;cursor:pointer;border:none;}



.sub-category-bar{background:#fff;border-bottom:1px solid var(--border-color);display:flex;padding:8px 14px;gap:8px;flex-shrink:0;}

.filter-item select,.filter-item button{font-size:12px;padding:7px 10px;border:1px solid var(--border-color);border-radius:var(--radius-sm);outline:none;background:var(--bg-subtle);color:var(--text-main);font-weight:600;width:100%;}

.filter-item{flex:1;}



.content-area{flex:1;overflow-y:auto;padding:12px 16px;padding-bottom:84px;}

.tab-content{display:none;}

.tab-content.active{display:block;}



.user-cards-grid{display:flex;flex-direction:column;max-height:calc(7 * 92px);overflow-y:auto;}

.community-feed{display:flex;flex-direction:column;}

.user-card{display:flex;gap:14px;cursor:pointer;align-items:center;padding:14px 4px;border-bottom:1px solid var(--border-color);}

.avatar{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;object-fit:cover;flex-shrink:0;border:1px solid var(--border-color);}

.avatar-sm{width:36px;height:36px;border-radius:50%;object-fit:cover;flex-shrink:0;border:1px solid var(--border-color);}

.avatar-large{width:110px;height:110px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:48px;margin:0 auto 14px auto;object-fit:cover;border:3px solid #fff;box-shadow:0 6px 15px rgba(0,0,0,.12);}

.avatar.female-default,.avatar-large.female-default,.avatar-sm.female-default{background:var(--pink-light);color:var(--pink-avatar);display:flex;align-items:center;justify-content:center;}

.avatar.male-default,.avatar-large.male-default,.avatar-sm.male-default{background:var(--blue-light);color:var(--blue-avatar);display:flex;align-items:center;justify-content:center;}

.user-nickname{font-size:15px;font-weight:700;color:var(--primary);}

.tag{font-size:11px;padding:2px 7px;border-radius:var(--radius-sm);background:var(--bg-subtle);color:var(--text-muted);font-weight:600;}



.post-row{padding:14px 4px;border-bottom:1px solid var(--border-color);cursor:pointer;}

.post-row-top{display:flex;align-items:center;gap:8px;}

.post-meta{flex:1;min-width:0;}

.post-meta-line1{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;}

.post-meta-line1 .nick{font-size:13px;font-weight:700;color:var(--primary);}

.post-meta-line1 .tagxs{font-size:11px;color:var(--text-muted);}

.post-time{font-size:11px;color:var(--text-muted);white-space:nowrap;}

.post-dots-btn{background:none;border:none;color:var(--text-muted);font-size:14px;cursor:pointer;padding:4px 6px;}

.post-preview{font-size:13px;color:var(--text-main);margin:8px 0 8px 0;line-height:1.4;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;line-clamp:2;-webkit-line-clamp:2;-webkit-box-orient:vertical;}

.post-actions{display:flex;gap:16px;align-items:center;}

.post-action-btn{background:none;border:none;font-size:12px;color:var(--text-muted);display:flex;align-items:center;gap:5px;cursor:pointer;font-weight:600;}

.post-action-btn.liked{color:var(--danger);}

.post-action-btn.liked i{color:var(--danger);}



.btn{border:none;border-radius:var(--radius-sm);padding:10px 18px;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;}

.btn-primary{background:var(--primary);color:#fff;}

.btn-secondary{background:var(--bg-subtle);color:var(--text-main);border:1px solid var(--border-color);}

.btn-danger{background:var(--danger);color:#fff;}

.btn-block{width:100%;}

.btn-sm{padding:6px 12px;font-size:12px;border-radius:6px;}



.bottom-nav{position:absolute;bottom:0;left:0;right:0;height:64px;background:#fff;border-top:1px solid var(--border-color);display:flex;justify-content:space-around;align-items:center;z-index:10;}

.nav-item{background:none;border:none;flex:1;height:100%;display:flex;align-items:center;justify-content:center;color:var(--text-muted);cursor:pointer;font-size:21px;}

.nav-item.active{color:var(--primary);}



.modal-overlay{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);display:none;justify-content:center;align-items:center;z-index:200;padding:16px;}

.modal-overlay.active{display:flex;}

.modal-card{background:#fff;border-radius:var(--radius-md);width:100%;max-width:420px;padding:22px;box-shadow:var(--shadow-lg);max-height:90vh;overflow-y:auto;position:relative;}

.mini-alert-card{background:#fff;border-radius:14px;width:100%;max-width:300px;padding:24px 20px;text-align:center;}



.full-screen-overlay{position:absolute;inset:0;background:#fff;z-index:150;display:none;flex-direction:column;}

.full-screen-overlay.active{display:flex;}

.fs-header{height:52px;flex-shrink:0;display:flex;align-items:center;padding:0 12px;border-bottom:1px solid var(--border-color);position:relative;}

.fs-header .back-btn{background:none;border:none;font-size:20px;color:var(--text-main);cursor:pointer;padding:6px;}

.fs-header .fs-title{position:absolute;left:50%;transform:translateX(-50%);font-size:15px;font-weight:700;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;}

.fs-header .fs-right{margin-left:auto;display:flex;gap:8px;align-items:center;}

.fs-body{flex:1;overflow-y:auto;}



.form-group{margin-bottom:14px;display:flex;flex-direction:column;}

.form-group label{font-size:12px;font-weight:700;color:#495057;margin-bottom:6px;}

.form-group input,.form-group select,.form-group textarea{padding:10px 12px;border:1px solid var(--border-color);border-radius:var(--radius-sm);font-size:13px;outline:none;background:var(--bg-subtle);}

.photo-slots{display:flex;gap:10px;margin-top:6px;}

.photo-slot{flex:1;aspect-ratio:1;border:2px dashed var(--border-color);border-radius:12px;background:var(--bg-subtle);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;overflow:hidden;}

.photo-preview{width:100%;height:100%;object-fit:cover;}

.scam-warning-text{font-size:11px;color:var(--danger);background:#fff0f0;border:1px solid #ffc9c9;padding:10px;border-radius:8px;margin-bottom:12px;line-height:1.4;}

.terminal-box{background:#1a1a1a;color:#39ff14;font-family:monospace;padding:10px 14px;border-radius:8px;font-size:12px;margin:10px 0;display:none;line-height:1.4;}

.hidden{display:none !important;}



.category-list{display:flex;flex-direction:column;gap:6px;margin-top:10px;}

.category-item{padding:12px 14px;background:var(--bg-subtle);border-radius:10px;font-size:13px;cursor:pointer;font-weight:600;}

.category-item:active{background:var(--border-color);}



.profile-photo-wrap{position:relative;width:100%;height:56vh;max-height:480px;background:#000;}

.profile-photo-wrap img{width:100%;height:100%;object-fit:cover;}

.profile-photo-dots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:6px;}

.profile-photo-dots span{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.5);}

.profile-photo-dots span.active{background:#fff;}

.profile-body{padding:16px;}

.last-seen-text{font-size:11px;color:var(--text-muted);margin-bottom:6px;}

.profile-name{font-size:20px;font-weight:800;}

.profile-tags{display:flex;gap:6px;margin:6px 0 12px 0;}

.profile-bio-box{background:var(--bg-subtle);border-radius:10px;padding:12px;font-size:12px;color:#495057;margin-bottom:16px;}



.msg-compose-screen{background:var(--primary);color:#fff;}

.msg-compose-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px;}

.msg-compose-avatar{width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid #fff;}

.msg-compose-input-row{padding:14px;display:flex;gap:8px;background:var(--primary);}

.msg-compose-input-row input{flex:1;border:none;border-radius:99px;padding:12px 16px;outline:none;font-size:13px;}

.msg-compose-input-row button{background:var(--primary-hover);color:#fff;border:none;border-radius:99px;padding:0 18px;font-weight:700;cursor:pointer;}



.chat-row-wrap{position:relative;overflow:hidden;border-bottom:1px solid var(--border-color);}

.chat-row-delete{position:absolute;top:0;right:0;bottom:0;width:70px;background:var(--danger);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;}

.chat-row-fg{position:relative;background:#fff;display:flex;gap:12px;align-items:center;padding:12px 4px;cursor:pointer;touch-action:pan-y;}

.chat-row-text{flex:1;min-width:0;}

.chat-row-nick{font-size:14px;font-weight:700;}

.chat-row-last{font-size:12px;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

.chat-row-time{font-size:11px;color:var(--text-muted);flex-shrink:0;}



.chat-window-card{height:100%;display:flex;flex-direction:column;padding:0;}

.chat-header-row{height:56px;flex-shrink:0;display:flex;align-items:center;padding:0 10px;border-bottom:1px solid #d8e6f2;gap:8px;}

.chat-header-avatar{width:30px;height:30px;border-radius:50%;object-fit:cover;border:1px solid var(--blue-light);}

.chat-header-nick{font-size:14px;font-weight:700;max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

.chat-warning-banner{background:#495057;color:#fff;font-size:11px;padding:10px 12px;line-height:1.5;}

.chat-warning-banner b{color:var(--warning);}

.chat-messages-area{flex:1;padding:14px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;background:var(--chat-bg);}

.chat-date-sep{align-self:center;background:rgba(0,0,0,.08);color:#495057;font-size:11px;border-radius:99px;padding:4px 14px;}

.msg-row{display:flex;flex-direction:column;max-width:75%;}

.msg-row.mine{align-self:flex-end;align-items:flex-end;}

.msg-row.other{align-self:flex-start;align-items:flex-start;}

.msg-bubble{padding:9px 13px;border-radius:14px;font-size:13px;line-height:1.4;color:#000;}

.msg-row.mine .msg-bubble{background:var(--chat-mine);border-bottom-right-radius:4px;}

.msg-row.other .msg-bubble{background:#fff;border:1px solid #d8e6f2;border-bottom-left-radius:4px;}

.msg-bubble img{max-width:160px;border-radius:8px;display:block;}

.msg-time{font-size:10px;color:#868e96;margin-top:2px;}

.msg-system{align-self:center;background:rgba(0,0,0,.06);color:var(--text-muted);font-size:11px;border-radius:99px;padding:4px 14px;}

.chat-input-bar{padding:10px;background:#fff;display:flex;gap:8px;align-items:center;flex-shrink:0;}

.chat-input-bar input[type=text]{flex:1;border:1px solid var(--border-color);border-radius:99px;padding:9px 14px;outline:none;}

.chat-attach-btn,.chat-send-btn{background:none;border:none;color:var(--primary);font-size:19px;cursor:pointer;padding:4px 8px;}



.compose-photo-box{width:120px;height:120px;margin:20px auto 10px auto;border:2px dashed var(--border-color);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text-muted);font-size:12px;cursor:pointer;overflow:hidden;}

.compose-textarea{flex:1;border:none;outline:none;resize:none;padding:16px;font-size:14px;width:100%;}

.compose-footer{display:flex;gap:10px;padding:14px;border-top:1px solid var(--border-color);}



.ad-video-box{background:#000;color:#fff;height:150px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:14px 0;text-align:center;}

.ad-progress-bar{width:80%;height:6px;background:#333;border-radius:3px;margin-top:12px;overflow:hidden;}

.ad-progress-fill{height:100%;width:0;background:var(--primary);transition:width 1s linear;}

</style>

</head>

<body>



<!-- 스플래시 화면 -->

<div id="splashScreen">

  <div style="text-align:center;">

    <div class="splash-logo">말벗</div>

    <div class="splash-sub">지금 이 순간, 실시간으로 이어지는 편안한 대화</div>

  </div>

</div>



<!-- 본인인증 & 가입 모달 -->

<div id="authModal" class="modal-overlay active">

  <div class="modal-card">

    <div style="text-align:center;margin-bottom:16px;">

      <h1 style="font-size:26px;color:var(--primary);font-weight:800;"><i class="fa-solid fa-comments" style="color:var(--pink-avatar);"></i> 말벗</h1>

      <p style="font-size:12px;color:var(--text-muted);">지금 이 순간, 실시간으로 이어지는 편안한 대화</p>

      <p id="authStepIndicator" style="font-size:11px;color:var(--primary);font-weight:700;margin-top:6px;">1 / 3 단계 · 본인인증</p>

    </div>

    <form id="authForm" onsubmit="return false;">

      <div id="authStep1">

        <div class="form-group">

          <label><i class="fa-solid fa-mobile-screen"></i> 본인인증 휴대폰 번호</label>

          <div style="display:flex;gap:6px;">

            <input type="tel" id="inputPhone" placeholder="010-1234-5678" style="flex:1;">

            <button type="button" id="btnRequestSms" class="btn btn-secondary btn-sm">인증번호 받기</button>

          </div>

        </div>

        <div id="terminalNotice" class="terminal-box">&gt; [SMS 터미널 발송] 인증번호: <strong id="generatedCode">1234</strong></div>

        <div class="form-group" id="smsInputGroup" style="display:none;">

          <label>인증번호 4자리 입력</label>

          <div style="display:flex;gap:6px;">

            <input type="text" id="inputSmsCode" placeholder="1234" maxlength="4" style="flex:1;">

            <button type="button" id="btnVerifySms" class="btn btn-primary btn-sm">인증 확인</button>

          </div>

          <span id="smsVerifyStatus" style="font-size:11px;margin-top:2px;"></span>

        </div>

      </div>

      <div id="authStep2" class="hidden">

        <h4 style="font-size:14px;margin-bottom:10px;"><i class="fa-solid fa-user-plus"></i> 회원 정보 입력</h4>

        <div style="display:flex;gap:8px;">

          <div class="form-group" style="flex:1;">

            <label>별명 (이름/개인번호 사용 금지)</label>

            <input type="text" id="regNickname" placeholder
