<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>쌀 충전하기 | 말벗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&family=Noto+Serif+KR:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFF9FB;
    --card:#FFFFFF;
    --ink:#241220;
    --ink-soft:#8A7480;
    --accent:#FF3D77;
    --accent-deep:#C41E5B;
    --accent-soft:#FFE3ED;
    --line:#F2D9E4;
    --grain:#FFC24B;
    --grain-soft:#FFF1D2;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
  }
  .grain-strip{
    height:6px;
    background:repeating-linear-gradient(90deg,var(--accent) 0 18px,var(--grain) 18px 26px,transparent 26px 34px);
  }
  header{
    max-width:920px;
    margin:0 auto;
    padding:44px 24px 8px;
    text-align:center;
  }
  .eyebrow{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:13px;
    font-weight:700;
    color:var(--accent-deep);
    background:var(--accent-soft);
    padding:6px 14px;
    border-radius:999px;
  }
  h1{
    font-family:'Noto Serif KR',serif;
    font-size:clamp(26px,5vw,36px);
    margin:16px 0 6px;
  }
  .sub{
    color:var(--ink-soft);
    font-size:15px;
    margin:0 0 8px;
  }
  .balance{
    display:inline-flex;
    align-items:center;
    gap:8px;
    margin-top:14px;
    background:var(--card);
    border:1px solid var(--line);
    padding:10px 18px;
    border-radius:999px;
    font-weight:700;
    font-size:15px;
  }
  .balance .grain-icon{font-size:16px;}

  main{
    max-width:1080px;
    margin:0 auto;
    padding:clamp(20px,4vw,36px) clamp(10px,3vw,24px) 40px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:clamp(6px,1.6vw,18px);
    width:100%;
  }

  .plan{
    position:relative;
    min-width:0;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:clamp(12px,2vw,22px);
    padding:clamp(12px,3vw,26px) clamp(8px,2vw,22px) clamp(12px,2.4vw,22px);
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .plan:hover{
    transform:translateY(-4px);
    box-shadow:0 16px 30px -14px rgba(255,61,119,.35);
  }
  .plan.popular{
    border-color:var(--accent);
    box-shadow:0 16px 34px -16px rgba(255,61,119,.4);
  }
  .badge{
    position:absolute;
    top:-12px;
    left:50%;
    transform:translateX(-50%);
    background:var(--accent);
    color:#fff;
    font-size:clamp(9px,2vw,12px);
    font-weight:700;
    padding:4px 10px;
    border-radius:999px;
    white-space:nowrap;
  }
  .grain-stack{
    font-size:clamp(18px,4.5vw,28px);
    margin-bottom:4px;
    letter-spacing:2px;
  }
  .plan .base-line{
    font-size:clamp(10px,2.2vw,14px);
    font-weight:600;
    color:var(--ink-soft);
    margin:2px 0 6px;
    white-space:nowrap;
  }
  .plan .base-line .plus-bonus{
    color:var(--accent-deep);
    font-weight:700;
  }
  .plan .total-emph{
    font-family:'Noto Serif KR',serif;
    font-size:clamp(17px,5vw,32px);
    font-weight:800;
    color:var(--accent-deep);
    line-height:1.2;
    margin-bottom:2px;
    white-space:nowrap;
  }
  .plan .total-emph .unit{
    font-size:.55em;
    font-weight:700;
  }
  .plan .total-label{
    font-size:clamp(9px,1.8vw,12px);
    color:var(--ink-soft);
    margin-bottom:10px;
    letter-spacing:.02em;
  }
  .plan .orig-price{
    font-size:clamp(10px,2.2vw,14px);
    color:var(--ink-soft);
    text-decoration:line-through;
    text-decoration-color:var(--accent);
    margin-bottom:2px;
    white-space:nowrap;
  }
  .plan .price-row{
    display:flex;
    align-items:baseline;
    justify-content:center;
    gap:6px;
    flex-wrap:wrap;
    margin-bottom:12px;
  }
  .plan .price{
    font-size:clamp(15px,4vw,22px);
    font-weight:800;
    white-space:nowrap;
  }
  .plan .discount-tag{
    font-size:clamp(9px,2vw,12px);
    font-weight:800;
    color:var(--accent-deep);
    white-space:nowrap;
  }
  .buy-btn{
    width:100%;
    padding:clamp(8px,2vw,13px) 0;
    border:none;
    border-radius:clamp(8px,1.6vw,14px);
    background:var(--accent);
    color:#fff;
    font-size:clamp(11px,2.6vw,15px);
    font-weight:700;
    cursor:pointer;
    transition:background .15s ease;
  }
  .buy-btn:hover{background:var(--accent-deep);}
  .buy-btn:disabled{background:#E3C9D3; cursor:not-allowed;}

  .status{
    max-width:560px;
    margin:26px auto 0;
    text-align:center;
    font-size:14px;
    color:var(--ink-soft);
    min-height:20px;
  }

  .fineprint{
    max-width:640px;
    margin:36px auto 0;
    font-size:12.5px;
    line-height:1.8;
    color:var(--ink-soft);
    text-align:center;
  }
</style>
</head>
<body>
  <div class="grain-strip"></div>
  <header>
    <span class="eyebrow">🌾 포인트 충전</span>
    <h1>쌀을 채우고<br>대화를 이어가요</h1>
    <p class="sub">충전한 쌀은 커뮤니티 글쓰기, 채팅 등 말벗의 다양한 기능에 사용돼요</p>
    <div class="balance"><span class="grain-icon">🌾</span> 보유 쌀 <span id="currentBalance">—</span>개</div>
  </header>

  <main>
    <div class="grid" id="planGrid">
      <!-- JS가 채워 넣습니다 -->
    </div>

    <p class="status" id="statusMsg"></p>

    <p class="fineprint">
      결제는 Google Play 인앱결제 시스템을 통해 안전하게 처리됩니다.<br>
      쌀은 충전 즉시 사용 가능하며, <b>일부라도 사용 시 환불이 제한</b>돼요. 자세한 내용은
      <a href="/refund-policy.html" style="color:var(--accent-deep)">환불정책</a>을 확인해 주세요.
    </p>
  </main>

<script>
/* ============================================================
   쌀(포인트) 패키지 정의
   - productId 는 Google Play Console > 수익 창출 > 상품 > 인앱 상품
     에서 동일한 ID로 "관리형 상품(managed product)"을 먼저 등록해야 합니다.
   - 가격은 Play Console 쪽 설정이 최종 기준이며, 아래 price 는
     화면 표시용 참고값입니다 (실제 결제창 가격은 스토어에서 가져옵니다).
============================================================ */
// 보너스 없이 낱개로 살 때의 기준 단가(원/개) - "정가" 취소선 계산에 사용
const BASE_UNIT_PRICE = 11.9;

const PLANS = [
  { id: 'points_1000',  base: 1000, bonusPct: 10, price: 11900, label: '가볍게 시작' },
  { id: 'points_3000',  base: 3000, bonusPct: 20, price: 38900, label: '가장 인기', popular: true },
  { id: 'points_5000',  base: 5000, bonusPct: 35, price: 73000, label: '든든하게' },
];

function renderPlans(){
  const grid = document.getElementById('planGrid');
  grid.innerHTML = PLANS.map(p => {
    const bonus = Math.round(p.base * p.bonusPct / 100);
    const total = p.base + bonus;
    const origPrice = Math.round(total * BASE_UNIT_PRICE / 10) * 10; // 정가(할인 전) - 10원 단위 반올림
    const discountPct = Math.round((1 - p.price / origPrice) * 100);
    return `
      <div class="plan ${p.popular ? 'popular' : ''}">
        ${p.popular ? '<span class="badge">가장 인기</span>' : ''}
        <div class="grain-stack">🌾</div>
        <div class="base-line">${p.base.toLocaleString()}개 <span class="plus-bonus">+${bonus.toLocaleString()}개</span></div>
        <div class="total-emph">${total.toLocaleString()}<span class="unit">개</span></div>
        <div class="total-label">총 지급 (보너스 ${p.bonusPct}%)</div>
        <div class="orig-price">${origPrice.toLocaleString()}원</div>
        <div class="price-row">
          <span class="price">${p.price.toLocaleString()}원</span>
          <span class="discount-tag">-${discountPct}%</span>
        </div>
        <button class="buy-btn" data-id="${p.id}">구매하기</button>
      </div>
    `;
  }).join('');

  grid.querySelectorAll('.buy-btn').forEach(btn=>{
    btn.addEventListener('click', () => purchasePlan(btn.dataset.id, btn));
  });
}
renderPlans();

/* ============================================================
   Google Play 인앱결제 연동 (Digital Goods API)
   - 이 페이지가 TWA(Trusted Web Activity)로 감싸진 안드로이드 앱
     안에서 열릴 때만 window.getDigitalGoodsService 를 사용할 수 있습니다.
   - 일반 브라우저(PC/모바일 웹)에서 열면 이 API가 없으므로,
     아래 코드는 "안된다"는 안내만 보여줍니다.
============================================================ */
const PLAY_BILLING_SERVICE_URL = 'https://play.google.com/billing';
let digitalGoodsService = null;

async function initBilling(){
  if (!window.getDigitalGoodsService) {
    setStatus('이 브라우저에서는 결제를 사용할 수 없어요. 말벗 앱에서 열어주세요.');
    disableAllButtons();
    return;
  }
  try {
    digitalGoodsService = await window.getDigitalGoodsService(PLAY_BILLING_SERVICE_URL);
    await refreshBalance();
  } catch (e) {
    console.error('Digital Goods Service 초기화 실패', e);
    setStatus('결제 서비스 연결에 실패했어요. 잠시 후 다시 시도해주세요.');
    disableAllButtons();
  }
}

function disableAllButtons(){
  document.querySelectorAll('.buy-btn').forEach(b => b.disabled = true);
}

async function purchasePlan(productId, btnEl){
  if (!digitalGoodsService) {
    setStatus('결제 서비스가 아직 준비되지 않았어요.');
    return;
  }
  btnEl.disabled = true;
  btnEl.textContent = '처리 중...';
  setStatus('');

  try {
    // 1) PaymentRequest로 결제 시트 띄우기
    const paymentMethodData = [{
      supportedMethods: PLAY_BILLING_SERVICE_URL,
      data: { sku: productId }
    }];
    const paymentDetails = { total: { label: '쌀 충전', amount: { currency: 'KRW', value: '0' } } };
    const request = new PaymentRequest(paymentMethodData, paymentDetails);

    const response = await request.show();
    const { purchaseToken } = response.details;
    await response.complete('success');

    // 2) 서버로 purchaseToken 전달 → 서버가 Google Play Developer API로 검증 후 포인트 지급
    const verifyRes = await fetch('/api/points/verify-purchase', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ productId, purchaseToken })
    });

    if (!verifyRes.ok) throw new Error('서버 검증 실패');
    const result = await verifyRes.json();

    // 3) 구매 확정 처리 (재지급 방지)
    if (digitalGoodsService.consume) {
      await digitalGoodsService.consume(purchaseToken); // 소모성 상품(포인트)은 consume 필수
    }

    setStatus(`충전 완료! ${result.grantedPoints ?? ''}개가 지급됐어요.`);
    await refreshBalance();
  } catch (e) {
    console.error('구매 실패', e);
    if (e.name === 'AbortError') {
      setStatus('결제를 취소했어요.');
    } else {
      setStatus('결제 중 문제가 발생했어요. 다시 시도해주세요.');
    }
  } finally {
    btnEl.disabled = false;
    btnEl.textContent = '구매하기';
  }
}

async function refreshBalance(){
  try {
    const res = await fetch('/api/points/balance');
    if (!res.ok) return;
    const data = await res.json();
    document.getElementById('currentBalance').textContent = (data.balance ?? 0).toLocaleString();
  } catch (e) {
    console.error('잔액 조회 실패', e);
  }
}

function setStatus(msg){
  document.getElementById('statusMsg').textContent = msg;
}

initBilling();
</script>
</body>
</html>
