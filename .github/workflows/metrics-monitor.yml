name: 지표-멤버십관리

on:
  schedule:
    - cron: '0 8 * * 0'  # 매주 일요일 UTC 08:00 = KST 17:00
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 의존성 설치
        run: npm install firebase-admin

      - name: 지표 집계 실행
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
        run: node scripts/metrics-monitor.js

      - name: 결과 파일 확인
        id: check
        run: |
          if [ -f "review-result.md" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 리포트파일 -> HTML 변환
        if: steps.check.outputs.exists == 'true'
        run: node scripts/md-to-html.js review-result.md report.html

      - name: 이슈 등록
        if: steps.check.outputs.exists == 'true'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "📈 주간 지표 리포트"
          content-filepath: review-result.md
          labels: metrics, bot

      - name: 이메일 발송
        if: steps.check.outputs.exists == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USER }}
          password: ${{ secrets.MAIL_PASS }}
          subject: "📈 [말벗] 주간 지표 리포트"
          to: ${{ secrets.MAIL_TO }}
          from: 말벗 자동화봇
          html_body: file://report.html
          attachments: report.html
