name: 보안점검관

on:
  schedule:
    - cron: '0 8 * * 3'  # 매주 수요일 UTC 08:00 = KST 17:00
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 앱 의존성 설치 (malbeot-app)
        run: |
          if [ -f "malbeot-app/package.json" ]; then
            cd malbeot-app && npm install --no-audit --no-fund
          fi

      - name: 보안 점검 실행
        run: node scripts/security-audit.js

      - name: 결과 파일 확인
        id: check
        run: |
          if [ -f "review-result.md" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 리포트파일 -> HTML 변환
        if: steps.check.outputs.exists == 'true'
        run: node scripts/md-to-html.js review-result.md report.html

      - name: 이슈 등록
        if: steps.check.outputs.exists == 'true'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "🔒 보안 점검 결과"
          content-filepath: review-result.md
          labels: security, bot

      - name: 이메일 발송
        if: steps.check.outputs.exists == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USER }}
          password: ${{ secrets.MAIL_PASS }}
          subject: "🔒 [말벗] 보안 점검 결과"
          to: ${{ secrets.MAIL_TO }}
          from: 말벗 자동화봇
          html_body: file://report.html
          attachments: report.html
