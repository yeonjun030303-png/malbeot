name: ai-community

# 매일 AI 캐릭터가 커뮤니티 글 1개씩 + 서로 댓글
# 09:00 KST에 한 번, 18:00 KST에 한 번 더 돌림(앞에서 실패해서 빠진 캐릭터/댓글만 보충하고, 이미 한 건 건너뜀)
on:
  workflow_dispatch:
    inputs:
      dry:
        description: 'true면 DB에 쓰지 않고 테스트만 함 (실제로 올리려면 false)'
        default: 'true'
      force:
        description: 'true면 오늘 이미 쓴 캐릭터도 또 씀 (보통 false)'
        default: 'false'

concurrency:
  group: ai-community
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: malbeot-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --omit=dev --no-audit --no-fund
      - name: Run AI community
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          DRY: ${{ inputs.dry }}
          FORCE: ${{ inputs.force }}
          REPORT_FILE: ${{ runner.temp }}/ai-report.json
        run: node scripts/ai-community.js