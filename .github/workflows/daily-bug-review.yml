name: 🐛 데일리 버그 리뷰

on:
  schedule:
    - cron: '0 8 * * *'   # UTC 8시 = 한국시간 오후 5시
  workflow_dispatch: {}    # "Run workflow" 버튼으로 수동 실행도 가능

permissions:
  contents: read
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 리뷰 스크립트 실행
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/daily-bug-review.js

      - name: 결과 존재 확인
        id: check
        run: |
          if [ -s review-result.md ]; then
            echo "has_result=true" >> $GITHUB_OUTPUT
          else
            echo "has_result=false" >> $GITHUB_OUTPUT
          fi

      - name: 이슈로 등록
        if: steps.check.outputs.has_result == 'true'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "🐛 데일리 버그 리뷰 - ${{ github.run_id }}"
          content-filepath: ./review-result.md
          labels: daily-review, bot

      - name: HTML 리포트 생성
        if: steps.check.outputs.has_result == 'true'
        run: node scripts/md-to-html.js review-result.md report.html "🐛 데일리 버그 리뷰"

      - name: 이메일 발송
        if: steps.check.outputs.has_result == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USER }}
          password: ${{ secrets.MAIL_PASS }}
          subject: "🐛 [말벗] 데일리 버그 리뷰"
          to: ${{ secrets.MAIL_TO }}
          from: 말벗 버그헌터
          html_body: file://report.html
          attachments: report.html