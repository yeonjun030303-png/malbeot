name: 🐛 데일리 버그 리뷰

on:
  schedule:
    - cron: '0 8 * * *'   # UTC 0시 = 한국시간 오전 9시
  workflow_dispatch: {}    # "Run workflow" 버튼으로 수동 실행도 가능

permissions:
  contents: read
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 리뷰 스크립트 실행
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/daily-bug-review.js

      - name: 결과 존재 확인
        id: check
        run: |
          if [ -s review-result.md ]; then
            echo "has_result=true" >> $GITHUB_OUTPUT
          else
            echo "has_result=false" >> $GITHUB_OUTPUT
          fi

      - name: 이슈로 등록
        if: steps.check.outputs.has_result == 'true'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "🐛 데일리 버그 리뷰 - ${{ github.run_id }}"
          content-filepath: ./review-result.md
          labels: daily-review, bot