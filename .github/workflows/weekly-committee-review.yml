name: 주간 결정위원회 파이프라인

on:
  schedule:
    - cron: '0 11 * * 0'  # 매주 일요일 UTC 11:00 = KST 20:00
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  team-lead-summary:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 팀장취합봇 실행
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
        run: node scripts/team-lead-summary.js

      - name: team-summaries.json 업로드
        uses: actions/upload-artifact@v4
        with:
          name: team-summaries
          path: team-summaries.json

  committee-review:
    needs: team-lead-summary
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: team-summaries.json 다운로드
        uses: actions/download-artifact@v4
        with:
          name: team-summaries

      - name: 결정위원회봇 실행
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
        run: node scripts/committee-review.js

      - name: committee-result.json 업로드
        uses: actions/upload-artifact@v4
        with:
          name: committee-result
          path: committee-result.json

      - name: committee-history.json 저장소에 커밋
        run: |
          git config user.name "committee-bot"
          git config user.email "actions@github.com"
          git add committee-history.json
          git diff --cached --quiet && echo "이력 변경 없음 - 커밋 스킵" || git commit -m "chore: 위원회 판단 이력 갱신 [skip ci]"
          git pull --rebase origin main
          git push

  chief-report:
    needs: committee-review
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: team-summaries.json 다운로드
        uses: actions/download-artifact@v4
        with:
          name: team-summaries

      - name: committee-result.json 다운로드
        uses: actions/download-artifact@v4
        with:
          name: committee-result

      - name: 총괄실장봇 실행
        run: node scripts/chief-report.js

      - name: 결과 파일 -> HTML 변환
        run: node scripts/md-to-html.js chief-report-result.md report.html "🏢 주간 총괄 리포트"

      - name: 이슈 등록 (대표 확인용)
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "🏢 주간 총괄 리포트"
          content-filepath: chief-report-result.md
          labels: chief-report, bot

      - name: 이메일 발송
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USER }}
          password: ${{ secrets.MAIL_PASS }}
          subject: "🏢 [말벗] 주간 총괄 리포트"
          to: ${{ secrets.MAIL_TO }}
          from: 말벗 자동화봇
          html_body: file://report.html
          attachments: report.html
